name: Tisa Platform — Windows build & release (exe)

# نسخه ویندوز = باندل همان platform/index.htm وب (منبع حقیقت واحد).
# هر تغییری روی platform/** → بیلد خودکار و ریلیز جدید روی GitHub Releases؛
# اپ‌های نصب‌شده با دکمه بروزرسانی داخل خود برنامه نسخه جدید را می‌گیرند.
# خروجی مک (dmg) در ورک‌فلوی جدا: desktop-release-mac.yml
on:
  push:
    branches: [ main ]
    paths:
      - 'platform/index.htm'
      - 'platform/images/**'
      - 'platform/vendor/**'
      - 'platform/sw.js'
      - 'platform/desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync web source into desktop bundle (single source of truth)
        shell: pwsh
        working-directory: .
        run: |
          node platform/desktop/sync.js
          Get-ChildItem platform/desktop/app | Format-Table Name, Length

      - name: Compute version (1.0.<run_number>)
        shell: pwsh
        working-directory: .
        run: |
          $v = "1.0.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('platform/desktop/package.json','utf8'));p.version='$v';fs.writeFileSync('platform/desktop/package.json',JSON.stringify(p,null,2));"
          "VERSION=$v" | Add-Content $env:GITHUB_ENV
          "TAG=v$v" | Add-Content $env:GITHUB_ENV
          Write-Host "Version: $v (tag: v$v)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        env:
          DEBUG: electron-builder
        run: npm run dist -- --publish never

      - name: Smoke test — silent install & launch on real Windows
        shell: pwsh
        working-directory: .
        run: |
          $exe = Get-ChildItem "platform/desktop/dist/*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap" } | Select-Object -First 1
          if (!$exe) { throw "no installer produced in dist/" }
          Write-Host "Silent installing: $($exe.Name)"
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Tisa Platform\Tisa Platform.exe"
          if (!(Test-Path $app)) { throw "Installer did not produce: $app" }
          Write-Host "Installed OK — launching app..."
          Start-Process -FilePath $app -ArgumentList "--disable-gpu"
          Start-Sleep -Seconds 12
          $p = Get-Process -Name "Tisa Platform" -ErrorAction SilentlyContinue
          if (!$p) { throw "App process is not running after launch" }
          Write-Host "App is running (PID $($p.Id)) OK"
          Stop-Process -Name "Tisa Platform" -Force -ErrorAction SilentlyContinue

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Upload artifact (backup copy of installer)
        uses: actions/upload-artifact@v4
        with:
          name: TisaPlatform-Setup-${{ env.VERSION }}-win
          path: platform/desktop/dist/*.exe
          if-no-files-found: error
