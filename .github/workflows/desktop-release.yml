name: Tisa Platform — Windows build & release (exe)

# نسخه ویندوز = باندل همان platform/index.htm وب (منبع حقیقت واحد).
# هر تغییری روی platform/** → بیلد خودکار و ریلیز جدید روی GitHub Releases؛
# اپ‌های نصب‌شده با دکمه بروزرسانی داخل خود برنامه نسخه جدید را می‌گیرند.
# خروجی مک (dmg) در ورک‌فلوی جدا: desktop-release-mac.yml
on:
  push:
    branches: [ main ]
    paths:
      - 'platform/index.htm'
      - 'platform/images/**'
      - 'platform/vendor/**'
      - 'platform/sw.js'
      - 'platform/desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: platform/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync web source into desktop bundle (single source of truth)
        shell: pwsh
        working-directory: .
        run: |
          node platform/desktop/sync.js
          Get-ChildItem platform/desktop/app | Format-Table Name, Length

      - name: Compute version (1.0.<run_number>)
        shell: pwsh
        working-directory: .
        run: |
          $v = "1.0.${{ github.run_number }}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('platform/desktop/package.json','utf8'));p.version='$v';fs.writeFileSync('platform/desktop/package.json',JSON.stringify(p,null,2));"
          "VERSION=$v" | Add-Content $env:GITHUB_ENV
          "TAG=v$v" | Add-Content $env:GITHUB_ENV
          Write-Host "Version: $v (tag: v$v)"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer
        env:
          DEBUG: electron-builder
        run: npm run dist -- --publish never

      - name: Smoke test — silent install & launch on real Windows
        shell: pwsh
        working-directory: .
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "platform/desktop/dist/*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap" } | Select-Object -First 1
          if (!$exe) { throw "no installer produced in dist/" }
          $dest = "$env:LOCALAPPDATA\Programs\TisaPlatform"
          Write-Host "Silent installing: $($exe.Name) -> $dest"
          $inst = Start-Process -FilePath $exe.FullName -ArgumentList "/S", "/D=$dest" -PassThru -Wait
          Write-Host "installer exit code: $($inst.ExitCode)"
          $app = Join-Path $dest "Tisa Platform.exe"
          if (!(Test-Path $app)) {
            Write-Host "expected path missing — searching under Programs..."
            $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Tisa Platform.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$found) { throw "installer did not produce Tisa Platform.exe anywhere (install check FAILED)" }
            $app = $found.FullName
          }
          Write-Host "Install check OK -> $app"
          $out = "$env:TEMP\tisa-out.txt"; $err = "$env:TEMP\tisa-err.txt"
          $proc = Start-Process -FilePath $app -ArgumentList "--disable-gpu" -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "=== app stderr ==="
            Get-Content $err -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "=== app stdout ==="
            Get-Content $out -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host "WARNING: app exited early on runner (code $($proc.ExitCode)) — install itself verified OK; launch is advisory here."
            exit 0
          }
          Write-Host "App is running OK (PID $($proc.Id))"
          Get-Process -Name "Tisa Platform" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: Upload artifact (backup copy of installer)
        uses: actions/upload-artifact@v4
        with:
          name: TisaPlatform-Setup-${{ env.VERSION }}-win
          path: platform/desktop/dist/*.exe
          if-no-files-found: error
