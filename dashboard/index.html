<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>داشبورد رزرو مشاوره</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf9f6; --ink:#1b2433; --line:rgba(27,36,51,.1); --blue:#b0c4de; --pink:#f5b7c1; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Vazirmatn, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { width: min(1100px, calc(100% - 32px)); margin: 40px auto; }
    h1 { font-size: 24px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; }
    label { display:block; font-size:13px; margin:12px 0 6px; }
    input { width:100%; min-height:44px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
    button { font:inherit; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; }
    .primary { background: linear-gradient(135deg, var(--blue), var(--pink)); color:#1b2433; font-weight:700; }
    .danger { background:#f3d6db; color:#7a2430; }
    .msg { min-height:24px; margin-top:10px; font-size:14px; }
    table { width:100%; border-collapse: collapse; font-size:14px; }
    th, td { border-bottom:1px solid var(--line); padding:10px 8px; text-align:right; }
    .toolbar { display:flex; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" id="login-card">
      <h1>ورود به داشبورد</h1>
      <label>نام کاربری</label>
      <input id="user" autocomplete="username">
      <label>رمز عبور</label>
      <input id="pass" type="password" autocomplete="current-password">
      <div style="margin-top:16px"><button class="primary" id="login-btn" type="button">ورود</button></div>
      <div class="msg" id="login-msg"></div>
    </section>

    <section class="card hidden" id="table-card">
      <div class="toolbar">
        <h1>رزروهای ثبت‌شده</h1>
        <div>
          <button type="button" id="reload">بازخوانی</button>
          <button type="button" id="logout">خروج</button>
        </div>
      </div>
      <div class="msg" id="table-msg"></div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>کد</th><th>نام</th><th>سن</th><th>قد</th><th>هدف</th><th>تماس</th><th>پیام</th><th>زمان</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const BASE = /\/demos\/v\d+/.test(location.pathname) ? "../../" : "../";
    async function loadConfig() {
      const res = await fetch(BASE + "config.json", { cache: "no-store" });
      return res.ok ? res.json() : {};
    }
    function api(cfg) {
      return String(cfg.workerUrl || "").replace(/\/+$/, "");
    }
    const loginCard = document.getElementById("login-card");
    const tableCard = document.getElementById("table-card");
    let config = {};

    async function listRows() {
      const token = sessionStorage.getItem("adminToken");
      const msg = document.getElementById("table-msg");
      msg.textContent = "";
      const res = await fetch(api(config) + "/api/appointments", {
        headers: { Authorization: "Bearer " + token }
      });
      if (res.status === 401) { sessionStorage.removeItem("adminToken"); showLogin(); return; }
      const data = await res.json();
      const body = document.getElementById("rows");
      body.innerHTML = "";
      (data.items || []).forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.id}</td><td>${row.name || ""}</td><td>${row.age || ""}</td><td>${row.height || ""}</td><td>${row.goal || ""}</td><td>${row.phone || ""}</td><td>${row.message || ""}</td><td>${row.created_at || ""}</td><td><button class="danger" data-id="${row.id}">حذف</button></td>`;
        body.appendChild(tr);
      });
      if (!(data.items || []).length) msg.textContent = "هنوز رزروی ثبت نشده است.";
    }

    function showLogin() {
      loginCard.classList.remove("hidden");
      tableCard.classList.add("hidden");
    }
    function showTable() {
      loginCard.classList.add("hidden");
      tableCard.classList.remove("hidden");
      listRows();
    }

    document.getElementById("login-btn").onclick = async () => {
      const msg = document.getElementById("login-msg");
      msg.textContent = "";
      if (!api(config)) { msg.textContent = "آدرس ورکر در config.json تنظیم نشده است."; return; }
      const res = await fetch(api(config) + "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("user").value,
          password: document.getElementById("pass").value
        })
      });
      const data = await res.json();
      if (!data.ok) { msg.textContent = "نام کاربری یا رمز نادرست است."; return; }
      sessionStorage.setItem("adminToken", data.token);
      showTable();
    };

    document.getElementById("rows").onclick = async (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      if (!confirm("این رکورد حذف شود؟")) return;
      await fetch(api(config) + "/api/appointments/" + btn.dataset.id, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + sessionStorage.getItem("adminToken") }
      });
      listRows();
    };
    document.getElementById("reload").onclick = listRows;
    document.getElementById("logout").onclick = () => { sessionStorage.removeItem("adminToken"); showLogin(); };

    loadConfig().then((cfg) => {
      config = cfg;
      if (sessionStorage.getItem("adminToken") && api(config)) showTable();
    });
  </script>
</body>
</html>
