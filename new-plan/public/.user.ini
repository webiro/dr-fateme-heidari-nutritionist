; cPanel per-directory PHP settings — lets the doctor upload big reels from the panel.
; cPanel honours .user.ini for PHP-FPM/CGI. If your host ignores it, raise the
; limits in cPanel → MultiPHP INI Editor instead.

upload_max_filesize = 256M
post_max_size = 260M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
