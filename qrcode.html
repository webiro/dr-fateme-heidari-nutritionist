<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کارت دیجیتال | فاطمه حیدری نائیج</title>
  <meta name="description" content="فاطمه حیدری، متخصص و کارشناس تغذیه در نوشهر. کارت دیجیتال ارتباطی Fateme Heidari Naeij.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body data-page="qr">
  <div id="loader" role="status">
    <div class="loader-mark">
      <div class="loader-mono">
        <img src="images/logo.svg" alt="" width="42" height="42">
      </div>
    </div>
  </div>

  <main class="qr-page">
    <article class="qr-card">
      <div class="qr-photo">
        <img src="images/doctor.jpg" alt="فاطمه حیدری نائیج" width="148" height="148">
      </div>
      <h1>فاطمه حیدری نائیج</h1>
      <p class="qr-en" lang="en" dir="ltr">Fateme Heidari Naeij</p>
      <p class="qr-role">متخصص و کارشناس تغذیه</p>
      <div class="qr-actions">
        <a data-link="website" href="/"><span class="material-symbols-rounded">home</span> ورود به سایت</a>
        <a data-link="telegram" href="https://t.me/diet_tisa"><span class="material-symbols-rounded">send</span> کانال تلگرام</a>
        <a data-link="instagram" href="https://instagram.com/diet_tisa"><span class="material-symbols-rounded">photo_camera</span> پیج اینستاگرام</a>
        <a href="/#appoint"><span class="material-symbols-rounded">event_available</span> رزرو وقت مشاوره رایگان</a>
        <a data-link="phone" href="#"><span class="material-symbols-rounded">call</span> تماس</a>
        <a data-link="whatsapp" href="#"><span class="material-symbols-rounded">chat</span> واتساپ</a>
      </div>
      <button class="theme-btn qr-theme" type="button" data-theme-toggle aria-label="تغییر زمینه">
        <span class="material-symbols-rounded">dark_mode</span>
      </button>
    </article>
  </main>

  <script src="app.js" defer></script>
  <script>
    window.addEventListener("load", () => {
      const l = document.getElementById("loader");
      if (l) { l.classList.add("is-gone"); setTimeout(() => l.remove(), 600); }
    });
  </script>
</body>
</html>
