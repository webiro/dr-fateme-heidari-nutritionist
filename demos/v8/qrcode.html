<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کارت دیجیتال | فاطمه حیدری نائیج</title>
  <meta name="description" content="فاطمه حیدری، متخصص و کارشناس تغذیه در نوشهر. کارت دیجیتال ارتباطی Fateme Heidari Naeij.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://drfatemeheidari.ir/index.html">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
  <script>
    window.SITE_BASE = /\/demos\/v\d+/.test(location.pathname.replace(/\\/g, "/")) ? "../../" : "";
  </script>
  <link rel="stylesheet" href="app.css" id="app-css">
  <script>document.getElementById("app-css").href = (window.SITE_BASE || "") + "app.css";</script>
</head>
<body data-page="qr" class="theme-v8">
  <div id="loader" role="status">
    <div class="loader-mark">
      <div class="loader-mono">
        <img src="images/logo.svg" alt="" width="42" height="42">
      </div>
    </div>
  </div>

  <main class="qr-page">
    <article class="qr-card">
      <div class="qr-photo">
        <img src="images/doctor.jpg" alt="فاطمه حیدری نائیج" width="148" height="148">
      </div>
      <h1>فاطمه حیدری نائیج</h1>
      <p class="qr-en" lang="en" dir="ltr">Fateme Heidari Naeij</p>
      <p class="qr-role">متخصص و کارشناس تغذیه</p>
      <div class="qr-actions" id="qr-actions"></div>
      <div class="qr-location" id="qr-location" hidden></div>
      <button class="theme-btn qr-theme" type="button" data-theme-toggle aria-label="تغییر زمینه">
        <span class="material-symbols-rounded">dark_mode</span>
      </button>
    </article>
  </main>

  <script>
    const appScript = document.createElement("script");
    appScript.src = (window.SITE_BASE || "") + "app.js";
    appScript.defer = true;
    document.body.appendChild(appScript);
  </script>
  <script>
    window.addEventListener("load", () => {
      const l = document.getElementById("loader");
      if (l) { l.classList.add("is-gone"); setTimeout(() => l.remove(), 600); }
    });
  </script>
</body>
</html>
